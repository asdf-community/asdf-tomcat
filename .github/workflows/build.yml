name: Build

on:
  push:
    branches:
      - main
  pull_request:
  # Archive layout and download URLs are not ours: a weekly run notices their changes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  plugin_test:
    name: install and run
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        query:
          - ""
          - "9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: asdf-vm/actions/setup@v4
      # Not asdf-vm/actions/plugin-test: "asdf plugin test" of asdf 0.16 and later does not run the test command.
      - name: Install and run Tomcat
        env:
          QUERY: ${{ matrix.query }}
        run: |
          plugins="${ASDF_DATA_DIR:-$HOME/.asdf}/plugins"
          mkdir -p "$plugins"
          cp -R "$GITHUB_WORKSPACE" "$plugins/tomcat"
          version=$(asdf latest tomcat "$QUERY")
          asdf install tomcat "$version"
          asdf set tomcat "$version"
          catalina.sh version | tee output.txt
          grep -q "Apache Tomcat/$version" output.txt
