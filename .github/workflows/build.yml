name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        version:
          - latest
          - latest:9
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          version: ${{ matrix.version }}
          command: catalina.sh version
